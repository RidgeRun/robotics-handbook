slam_toolbox:
  ros__parameters:
    # Frames and topic supplied by sensor_talker.py.
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    # Run online asynchronous mapping and publish a compact demo map quickly.
    mode: mapping
    resolution: 0.05
    map_update_interval: 2.0
    transform_publish_period: 0.02
    minimum_time_interval: 0.1
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    max_laser_range: 10.0
    throttle_scans: 1
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    enable_interactive_mode: false
    stack_size_to_use: 40000000

    # Keep loop closure enabled, even though this stationary room has no
    # trajectory. These are the standard online mapping defaults.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
